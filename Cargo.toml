[package]
name = "dato"
version = "0.0.2"
edition = "2024"
description = "Database Client TUI for SQLite and MySQL"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeoBorai/dato"
readme = "README.md"
keywords = ["sqlite", "mysql", "cli", "repl", "database"]
categories = ["command-line-utilities", "database"]
include = ["/src", "/tests", "/README.md", "/Cargo.toml", "/Cargo.lock"]

[lib]
name = "dato"
path = "src/lib.rs"

[[bin]]
name = "dato"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3"
dirs = "7"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust"] }
nu-ansi-term = "0.50"
reedline = "~0.53"
rpassword = "7.5.5"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
