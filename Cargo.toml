[package]
name = "dato"
version = "0.0.0"
edition = "2024"
description = "Database Client TUI for SQLite"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeoBorai/dato"
readme = "README.md"
keywords = ["sqlite", "cli", "repl", "database", "sql"]
categories = ["command-line-utilities", "database"]
include = ["/src", "/tests", "/README.md", "/Cargo.toml", "/Cargo.lock"]

[lib]
name = "dato"
path = "src/lib.rs"

[[bin]]
name = "dato"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "7"
nu-ansi-term = "0.50"
reedline = "~0.53"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
