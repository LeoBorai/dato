[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Older copies pulled in by reedline; drop these once it moves to the newer versions.
skip = [
    { crate = "syn@2.0.119" },
    { crate = "windows-sys@0.59.0" },
    # Older copies pulled in by mysql_common; drop once it moves to the newer versions.
    { crate = "base64@0.22.1" },
    { crate = "getrandom@0.3.4" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
