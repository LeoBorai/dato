[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # rustls (ring, rustls-webpki, untrusted) and subtle, pulled in by the PostgreSQL TLS stack.
    "ISC",
    "BSD-3-Clause",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Older copies pulled in by reedline; drop these once it moves to the newer versions.
skip = [
    { crate = "syn@2.0.119" },
    { crate = "windows-sys@0.59.0" },
    # Older copies pulled in by mysql_common; drop once it moves to the newer versions.
    { crate = "base64@0.22.1" },
    { crate = "getrandom@0.3.4" },
    { crate = "r-efi@5.3.0" },
    # Older copies pulled in by tokio-postgres (postgres-protocol, whoami) next to
    # the newer ones used by mysql_common/tempfile; drop once they line up.
    { crate = "block-buffer@0.10.4" },
    { crate = "const-oid@0.9.6" },
    { crate = "cpufeatures@0.2.17" },
    { crate = "crypto-common@0.1.7" },
    { crate = "digest@0.10.7" },
    { crate = "fallible-iterator@0.2.0" },
    { crate = "getrandom@0.2.17" },
    { crate = "sha2@0.10.9" },
    { crate = "wasi@0.11.1+wasi-snapshot-preview1" },
    { crate = "windows-sys@0.52.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
