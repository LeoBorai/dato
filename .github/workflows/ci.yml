name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # new advisories appear without any change to this repo
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo nextest run --no-tests=pass

      - name: Doctests
        run: cargo test --doc

      - name: Package builds from its own tarball (what `cargo publish` verifies)
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --locked

  mysql:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dato
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdato"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATO_MYSQL_URL: mysql://root:dato@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: MySQL tests
        run: cargo nextest run --test mysql

  psql:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      DATO_PSQL_URL: postgres://postgres:dato@127.0.0.1:5432
      DATO_PSQL_CA: ${{ github.workspace }}/pgcerts/ca.crt
    steps:
      - uses: actions/checkout@v7

      # A private CA and an end-entity server certificate: the verifier rejects a
      # self-signed certificate that is its own CA.
      - name: PostgreSQL server with TLS
        run: |
          mkdir pgcerts && cd pgcerts
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=dato test CA" \
            -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" \
            -keyout server.key -out server.csr
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -days 2 -extfile ext.cnf -out server.crt
          # The server reads its key as the `postgres` user (uid 999) and insists on 0600.
          # chmod first: after the chown the runner user may no longer change the mode.
          chmod 600 server.key
          sudo chown 999:999 server.key server.crt
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=dato \
            -v "$PWD:/certs:ro" postgres:17 \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -h 127.0.0.1 && exit 0
            sleep 2
          done
          docker logs pg
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: PostgreSQL tests
        run: cargo nextest run --test psql

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Advisories, licenses, bans, sources
        run: cargo deny check -D warnings
